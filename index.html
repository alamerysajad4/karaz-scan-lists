<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماسح القوائم</title>
<meta name="theme-color" content="#A3173D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ماسح القوائم">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F4F5FA;--card:#fff;--ink:#1D1B2A;--muted:#6B6880;--line:#E6E5EF;--soft:#F7F7FB;--brand:#A3173D;--brand-l:#FFE3EA;
  --ok:#11643F;--ok-l:#E4F8EE;--bad:#B4361A;--bad-l:#FFE9E1;--warn:#8A5300;--warn-l:#FFF1D9;--blue:#1D5FA8;--blue-l:#E3F1FF;--shadow:0 6px 18px rgba(29,27,42,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#15131D;--card:#211E2C;--ink:#F1EFF8;--muted:#A6A2B8;--line:#34304A;--soft:#2A2638;--brand:#E0476C;--brand-l:#3A1B26;
  --ok:#5FD49A;--ok-l:#163326;--bad:#FF8A6B;--bad-l:#3A1F18;--warn:#F2B455;--warn-l:#3A2C14;--blue:#7DB4F2;--blue-l:#16263A;--shadow:0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px}
.hrow{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
h1{font-size:19px;margin:0;font-weight:800}.sub{color:var(--muted);font-size:12.5px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;
  background:var(--card);color:var(--ink);box-shadow:var(--shadow);min-height:48px}
.btn.primary{background:var(--brand);color:#fff}.btn.ghost{background:transparent;box-shadow:none}.btn.small{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:11px}
.btn.block{width:100%}.btn:disabled{opacity:.5}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:19px;cursor:pointer;flex-shrink:0}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.note{border-radius:14px;padding:12px 14px;font-size:13.5px;margin:10px 0}.note.info{background:var(--blue-l);color:var(--blue)}
.note.warn{background:var(--warn-l);color:var(--warn)}.note.bad{background:var(--bad-l);color:var(--bad)}.note.ok{background:var(--ok-l);color:var(--ok)}
.lists{display:grid;gap:12px}.lcard{padding:16px;width:100%;text-align:right;border:0;cursor:pointer;display:block}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:99px;padding:8px 14px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap;font-weight:700;font-size:13.5px}
.chip.on{background:var(--brand);color:#fff}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;background:var(--card);box-shadow:var(--shadow);min-height:46px;font-size:16px}
.items{display:grid;gap:10px;margin-top:10px}
.item{padding:12px 14px}.item.ok{box-shadow:0 0 0 2px var(--ok),var(--shadow)}.item.miss{opacity:.6}
.itop{display:flex;gap:10px;align-items:flex-start}
.idx{min-width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:800}
.iname{font-weight:800;font-size:16px}.imeta{color:var(--muted);font-size:13px;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:10px}
.scanbox{flex:1;min-height:54px;border:2.5px dashed var(--brand);border-radius:15px;background:var(--brand-l);color:var(--brand);font-weight:800;font-size:15.5px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px}
.scanbox.has{border-style:solid;border-color:var(--ok);background:var(--ok-l);color:var(--ok);justify-content:space-between}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;letter-spacing:.5px;direction:ltr}
.tg{width:54px;border-radius:15px;border:2px solid var(--line);background:transparent;font-size:18px;font-weight:800;cursor:pointer}
.tg.on.okb{background:var(--ok);border-color:var(--ok);color:#fff}.tg.on.missb{background:var(--bad);border-color:var(--bad);color:#fff}
.dock{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);box-shadow:0 -6px 20px rgba(29,27,42,.1);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .wrap{display:flex;gap:10px;padding:0}
.ov{position:fixed;inset:0;z-index:100;background:rgba(20,18,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld span{font-size:13px;color:var(--muted);font-weight:700}
.fld input,.fld select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);min-height:46px;font-size:16px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1}
/* الماسح */
.scanner{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:flex;flex-direction:column}
.sc-top{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:rgba(0,0,0,.6)}
.sc-name{font-size:19px;font-weight:800}.sc-sub{font-size:13px;opacity:.8}
#reader{flex:1;min-height:0;position:relative;overflow:hidden}
#reader video{width:100%!important;height:100%!important;object-fit:cover}
.sc-bot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.6);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sc-bot .btn{flex:1;min-height:50px}
.flash{position:absolute;inset:0;background:rgba(17,100,63,.55);display:grid;place-items:center;font-size:26px;font-weight:800;pointer-events:none;z-index:5}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;width:100%}
.sw input{width:22px;height:22px;accent-color:var(--brand)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:300;background:var(--ink);color:var(--bg);border-radius:14px;
  padding:12px 16px;font-weight:700;text-align:center;max-width:560px;margin:0 auto}
.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.fields{display:grid;gap:8px;margin-top:10px}
.frow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--soft);font-weight:700;font-size:14px}
.frow>span{flex:1;min-width:0}.frow small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.frow.need{background:var(--warn-l);color:var(--warn)}
.fin{width:86px;min-height:42px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);text-align:center;font-size:18px;font-weight:800}
.fin.wide{width:120px}.fin:focus{outline:none;border-color:var(--brand)}
.bcbox{display:block;width:100%;border:0;padding:12px 14px 8px;margin-top:10px;background:#fff;border-radius:14px;cursor:pointer;box-shadow:0 0 0 2px var(--ok)}
.bcacts{display:flex;gap:6px;flex-wrap:wrap}.bcacts .btn{flex:1;box-shadow:none;background:var(--soft)}
.bcview{position:fixed;inset:0;z-index:150;background:#fff;color:#111;display:flex;flex-direction:column}
.bcv-top{display:flex;gap:10px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.bcv-name{font-size:20px;font-weight:800}.bcv-sub{font-size:13.5px;color:#555}
.bcview .icon-btn{background:#f1f1f4;color:#111;box-shadow:none}
.bcv-code{flex:1;display:flex;align-items:center;justify-content:center;padding:0 4vw}.bcv-code>div{width:100%;max-width:640px}
.bcv-hint{text-align:center;color:#555;font-size:13px;padding:6px 16px}
.bcv-bot{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.bcv-bot .btn{flex:1;background:#f1f1f4;color:#111;box-shadow:none}.bcv-bot .btn.primary{background:#A3173D;color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<input id="fileIn" type="file" accept=".xlsx,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" class="hidden">
<input id="photoIn" type="file" accept="image/*" capture="environment" class="hidden">
<script src="html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
